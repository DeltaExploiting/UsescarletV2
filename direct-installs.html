<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08090d"><title>Direct Installs</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#08090d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}body{padding:0 36px 60px}.wrap{max-width:1200px;margin:0 auto;padding-top:50px}.back{display:inline-block;margin-bottom:52px;color:#bfc2ca;text-decoration:none;font-weight:700;font-size:15px}.heading{font-size:52px;line-height:1.05;letter-spacing:-.04em;margin:0 0 18px;font-weight:850}.sub{font-size:22px;color:#aaaeb8;margin:0 0 66px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.install-box{height:92px;border-radius:28px;border:2px solid #282b31;background:linear-gradient(145deg,#16181d,#101217);box-shadow:inset 0 1px 0 #ffffff0a,0 8px 24px #0004;display:flex;align-items:center;justify-content:center;text-decoration:none;color:#d9dce3;font-size:22px;font-weight:800;transition:transform .15s,border-color .15s}.install-box:active{transform:scale(.98)}.install-box:hover{border-color:#3b3e45}.esign-bank{grid-column:1/-1;display:none;width:100%;min-height:130px;border-radius:26px;border:2px solid #282b31;background:linear-gradient(145deg,#16181d,#101217);box-shadow:inset 0 1px 0 #ffffff0a,0 8px 24px #0004;align-items:center;padding:22px 30px;color:#d9dce3;gap:34px}.esign-bank.show{display:flex}.esign-icon{width:112px;height:112px;border-radius:22px;object-fit:cover;flex:0 0 auto}.esign-info{display:flex;flex-direction:column;justify-content:center}.esign-bank .title{font-size:25px;font-weight:800}.esign-bank .subtext{font-size:16px;color:#aaaeb8;margin-top:8px}@media(max-width:700px){body{padding:0 20px 40px}.wrap{padding-top:44px}.back{margin-bottom:48px}.heading{font-size:42px}.sub{font-size:19px;margin-bottom:48px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.install-box{height:82px;border-radius:24px;font-size:18px}.esign-bank{width:100%;min-height:120px;border-radius:24px;padding:18px 22px;gap:22px}.esign-icon{width:92px;height:92px;border-radius:20px}.esign-bank .title{font-size:23px}.esign-bank .subtext{font-size:15px}}
</style></head><body><main class="wrap"><a class="back" href="index.html">← Back to Scarlet</a><h1 class="heading">Direct Installs</h1><p class="sub">Direct install links for your favorite apps.</p><section class="grid"><button class="install-box" id="esignButton" type="button">ESign</button><a class="install-box" href="#">Scarlet</a><a class="install-box" href="#">KSign</a><div class="esign-bank" id="esignBank"><img class="esign-icon" src="esign-icon.svg" alt="E.Sign"><div class="esign-info"><div class="title">ESign</div><div class="subtext">HSBC Bank Plc</div></div></div></section></main><script>document.getElementById('esignButton').addEventListener('click',function(){document.getElementById('esignBank').classList.toggle('show')});</script></body></html>
